name: Animations

on:
  push:
    paths: ["animations/**", "tools/anim/**", ".github/workflows/animations.yml"]
  pull_request:
    paths: ["animations/**", "tools/anim/**", ".github/workflows/animations.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/anim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gifsicle
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m tabby_anim build ../../animations/src --out ../../dist/animations
      - uses: actions/upload-artifact@v4
        with:
          name: animations
          path: dist/animations
          if-no-files-found: error
